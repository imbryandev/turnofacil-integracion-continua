services:
  agenda:
    build: ./api-agenda
    environment:
      DATABASE_PATH: /data/turnos.db
      NOTIFICATIONS_URL: http://notificaciones:8001
    ports:
      - "8000:8000"
    volumes:
      - agenda-data:/data
    depends_on:
      notificaciones:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  notificaciones:
    build: ./servicio-notificaciones
    environment:
      DATABASE_PATH: /data/notificaciones.db
    ports:
      - "8001:8001"
    volumes:
      - notifications-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  agenda-data:
  notifications-data:
